version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chess_helper
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chess_helper"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./FrontendWebApplication_backend
      dockerfile: Dockerfile
    image: chess-learner-helper-backend:dev
    working_dir: /app
    environment:
      - PORT=4000
      - APP_BASE_URL=http://localhost:4000
      - CORS_ORIGINS=http://localhost:3000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/chess_helper?schema=public
      - JWT_SECRET=dev_jwt_secret_change_me
      - JWT_REFRESH_SECRET=dev_jwt_refresh_secret_change_me
      - FEATURE_MULTIPLAYER=true
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run start"

  frontend:
    build:
      context: ./FrontendWebApplication
      dockerfile: Dockerfile
    image: chess-learner-helper-frontend:dev
    working_dir: /app
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
      - REACT_APP_API_BASE_URL=http://localhost:4000
      - REACT_APP_WS_URL=ws://localhost:4000
      - REACT_APP_FEATURE_MULTIPLAYER=true
      - REACT_APP_FEATURE_AI=true
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: sh -c "npm install && npm start"

volumes:
  dbdata:
